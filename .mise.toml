# Toolchain for the nghiep-pham-ecosys workspace (spec §11).
# Pinned versions; bump them in a PR, never ad hoc.
[tools]
# No python pin: the tools need PyYAML, which the system /usr/bin/python3 (3.12)
# already has and a mise-managed python would not. CI pins its python with
# actions/setup-python instead.
uv = "0.13.7"
node = "22"
pnpm = "12.18.0"
just = "1.59.0"
gitleaks = "8.30.1"
typst = "0.15.1"
actionlint = "1.7.12"
